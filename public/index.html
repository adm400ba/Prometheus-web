<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus Obfuscator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1d24;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2d313a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 1200px; background: var(--panel-bg); border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); text-align: center; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; padding: 1.5rem 2rem; background: #15171c; }
        .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .control-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        
        select, input { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 0.75rem; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
        select:focus, input:focus { border-color: var(--primary); }
        
        .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
        .editor-container { background: var(--panel-bg); display: flex; flex-direction: column; }
        .editor-header { padding: 0.75rem 2rem; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); background: #1c1f26; border-bottom: 1px solid var(--border); }
        
        /* Upload Area Styles */
        .upload-area { height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; background: var(--panel-bg); border: 2px dashed var(--border); margin: 1.5rem; border-radius: 8px; transition: border 0.2s, background 0.2s; }
        .upload-area:hover { border-color: var(--primary); background: #1f232b; }
        .upload-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.7; }
        
        textarea { width: 100%; height: 400px; background: var(--panel-bg); color: #a5b4fc; border: none; padding: 1.5rem 2rem; font-family: 'Fira Code', monospace; font-size: 0.9rem; resize: none; outline: none; }
        
        .actions { padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); gap: 1rem; flex-wrap: wrap; }
        .main-btn { background: var(--primary); color: white; border: none; padding: 0.85rem 2.5rem; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; flex-grow: 1; max-width: 300px; }
        .main-btn:hover { background: var(--primary-hover); }
        .main-btn:disabled { background: #475569; cursor: not-allowed; }
        
        .output-actions { display: flex; gap: 1rem; display: none; }
        .secondary-btn { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .secondary-btn:hover { border-color: var(--text-muted); }
        .btn-success { background: var(--success); border-color: var(--success); color: #fff; }

        @media (max-width: 800px) {
            body { padding: 1rem; }
            .editors { grid-template-columns: 1fr; }
            .upload-area, textarea { height: 250px; margin: 1rem; width: auto; }
            .actions { flex-direction: column; align-items: stretch; }
            .main-btn { max-width: 100%; }
            .output-actions { width: 100%; justify-content: stretch; }
            .output-actions button { flex: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Prometheus Luau Obfuscator</h1>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Nível de Ofuscação</label>
            <select id="preset">
                <option value="Weak">Weak (Fraco)</option>
                <option value="Medium" selected>Medium (Recomendado)</option>
                <option value="Strong">Strong (Forte/Lento)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Seed Customizada (Opcional)</label>
            <input type="text" id="seed" placeholder="Deixe em branco para aleatório">
        </div>
    </div>

    <div class="editors">
        <div class="editor-container">
            <div class="editor-header">1. SELECIONE O ARQUIVO (.LUA)</div>
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📁</div>
                <h3 id="fileName" style="margin-bottom: 10px;">Nenhum arquivo selecionado</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Clique para selecionar ou arraste um arquivo</p>
                <input type="file" id="fileInput" accept=".lua,.txt" style="display: none;">
            </div>
        </div>
        <div class="editor-container">
            <div class="editor-header">2. RESULTADO OFUSCADO</div>
            <textarea id="outputCode" readonly placeholder="O código protegido aparecerá aqui após o processamento..."></textarea>
        </div>
    </div>

    <div class="actions">
        <button class="main-btn" id="obfuscateBtn" onclick="obfuscateCode()">Ofuscar Arquivo</button>
        
        <div class="output-actions" id="outputActions">
            <button class="secondary-btn" id="copyBtn" onclick="copyCode()">Copiar Código</button>
            <button class="secondary-btn btn-success" id="downloadBtn" onclick="downloadCode()">Baixar Script</button>
        </div>
    </div>
</div>

<script>
    let currentFileContent = "";
    let originalFileName = "script";

    // Lida com a seleção do arquivo
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        document.getElementById('fileName').innerText = file.name;
        document.getElementById('fileName').style.color = 'var(--primary)';
        originalFileName = file.name.replace(/\.[^/.]+$/, ""); // Pega o nome sem extensão
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            currentFileContent = evt.target.result;
        };
        reader.readAsText(file);
    });

    async function obfuscateCode() {
        const preset = document.getElementById('preset').value;
        const seed = document.getElementById('seed').value;
        const btn = document.getElementById('obfuscateBtn');
        const outputCode = document.getElementById('outputCode');
        const outputActions = document.getElementById('outputActions');

        if (!currentFileContent) {
            return alert("Por favor, selecione um arquivo .lua primeiro clicando na área de upload.");
        }

        btn.disabled = true;
        btn.innerText = "Processando...";
        outputCode.value = "Ofuscando no servidor...\nIsso pode levar alguns segundos dependendo do tamanho do arquivo.";
        outputActions.style.display = "none";

        try {
            const response = await fetch('/api/obfuscate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: currentFileContent, preset: preset, seed: seed })
            });

            const data = await response.json();

            if (data.error) {
                outputCode.value = "ERRO: " + data.error;
            } else {
                outputCode.value = data.obfuscatedCode;
                outputActions.style.display = "flex"; 
            }
        } catch (err) {
            outputCode.value = "Falha de conexão com o servidor. Tente novamente.";
        }

        btn.disabled = false;
        btn.innerText = "Ofuscar Arquivo";
    }

    function copyCode() {
        const output = document.getElementById('outputCode');
        output.select();
        document.execCommand('copy');
        
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerText = "Copiado!";
        setTimeout(() => copyBtn.innerText = "Copiar Código", 2000);
    }

    function downloadCode() {
        const output = document.getElementById('outputCode').value;
        const blob = new Blob([output], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        // Salva o arquivo com _obfuscated no final (ex: meujogo_obfuscated.lua)
        a.download = `${originalFileName}_obfuscated.lua`; 
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
