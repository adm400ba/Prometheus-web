<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus Web Obfuscator</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; font-size: 1.8rem; color: #38bdf8; text-align: center; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .control-group { display: flex; flex-direction: column; }
        label { font-size: 0.85rem; margin-bottom: 5px; color: #94a3b8; }
        select, input { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; }
        .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media(max-width: 768px) { .editors { grid-template-columns: 1fr; } }
        .editor-box { display: flex; flex-direction: column; }
        textarea { width: 100%; height: 350px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 0.9rem; resize: vertical; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; width: 100%; }
        button:hover { background: #0ea5e9; }
        .error { color: #f87171; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prometheus Web Obfuscator</h1>
        <div class="controls">
            <div class="control-group">
                <label for="luaVersion">Versão do Lua</label>
                <select id="luaVersion">
                    <option value="Luau">Luau (Roblox)</option>
                    <option value="Lua51">Lua 5.1</option>
                </select>
            </div>
            <div class="control-group">
                <label for="preset">Preset</label>
                <select id="preset">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                    <option value="Strong">Strong</option>
                </select>
            </div>
            <div class="control-group">
                <label for="seed">Seed (Opcional)</label>
                <input type="number" id="seed" placeholder="Ex: 12345">
            </div>
        </div>
        <div class="editors">
            <div class="editor-box">
                <label>Código Original</label>
                <textarea id="inputCode" placeholder="Cole seu código aqui..."></textarea>
            </div>
            <div class="editor-box">
                <label>Código Ofuscado</label>
                <textarea id="outputCode" readonly placeholder="O resultado aparecerá aqui..."></textarea>
            </div>
        </div>
        <button id="obfuscateBtn">Ofuscar Código</button>
        <div id="errorMessage" class="error"></div>
    </div>
    <script>
        document.getElementById('obfuscateBtn').addEventListener('click', async () => {
            const code = document.getElementById('inputCode').value;
            const luaVersion = document.getElementById('luaVersion').value;
            const preset = document.getElementById('preset').value;
            const seed = document.getElementById('seed').value;
            const errorDiv = document.getElementById('errorMessage');
            const outputArea = document.getElementById('outputCode');
            errorDiv.textContent = '';
            outputArea.value = 'Processando...';
            try {
                const response = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, luaVersion, preset, seed })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro desconhecido');
                outputArea.value = data.obfuscatedCode;
            } catch (err) {
                outputArea.value = '';
                errorDiv.textContent = err.message;
            }
        });
    </script>
</body>
</html>
