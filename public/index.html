<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus Web Obfuscator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --error: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            margin: 0 0 30px 0;
            font-size: 2rem;
            text-align: center;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input[type="number"] {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus, input[type="number"]:focus {
            border-color: var(--accent);
        }
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: rgba(15, 23, 42, 0.5);
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            pointer-events: none;
        }
        .upload-text span {
            color: var(--accent);
            font-weight: 600;
        }
        #fileNameDisplay {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: 600;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        button:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }
        .output-area {
            margin-top: 30px;
            display: none;
        }
        textarea {
            width: 100%;
            height: 250px;
            background: var(--bg-color);
            color: #10b981;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 15px;
        }
        .actions {
            display: flex;
            gap: 15px;
        }
        .actions button {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .actions button:hover {
            background: var(--border);
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }
        .error { color: var(--error); }
        .success { color: #10b981; }
        
        @media(max-width: 600px) {
            .container { padding: 25px 15px; }
            h1 { font-size: 1.5rem; }
            .upload-area { padding: 30px 15px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prometheus Obfuscator</h1>
        
        <div class="settings-grid">
            <div class="form-group">
                <label for="luaVersion">Versão</label>
                <select id="luaVersion">
                    <option value="Luau">Luau (Roblox)</option>
                    <option value="Lua51">Lua 5.1</option>
                </select>
            </div>
            <div class="form-group">
                <label for="preset">Preset</label>
                <select id="preset">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                    <option value="Strong">Strong</option>
                </select>
            </div>
            <div class="form-group">
                <label for="seed">Seed (Opcional)</label>
                <input type="number" id="seed" placeholder="Ex: 12345">
            </div>
        </div>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept=".lua,.txt">
            <div class="upload-text">Arraste um arquivo Lua ou <span>Clique aqui</span></div>
            <span id="fileNameDisplay"></span>
        </div>

        <button id="obfuscateBtn">Ofuscar Código</button>
        <div id="statusMessage" class="message"></div>

        <div class="output-area" id="outputArea">
            <label>Código Ofuscado</label>
            <textarea id="outputCode" readonly></textarea>
            <div class="actions">
                <button id="copyBtn">Copiar Código</button>
                <button id="downloadBtn">Baixar Arquivo</button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const obfuscateBtn = document.getElementById('obfuscateBtn');
        const statusMessage = document.getElementById('statusMessage');
        const outputArea = document.getElementById('outputArea');
        const outputCode = document.getElementById('outputCode');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let selectedFile = null;

        const updateFileDisplay = (file) => {
            if (file && (file.name.endsWith('.lua') || file.name.endsWith('.txt'))) {
                selectedFile = file;
                fileNameDisplay.textContent = `Arquivo selecionado: ${file.name}`;
                statusMessage.textContent = '';
            } else {
                selectedFile = null;
                fileNameDisplay.textContent = '';
                statusMessage.className = 'message error';
                statusMessage.textContent = 'Por favor, selecione um arquivo .lua ou .txt válido.';
            }
        };

        fileInput.addEventListener('change', (e) => {
            updateFileDisplay(e.target.files[0]);
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileDisplay(e.dataTransfer.files[0]);
            }
        });

        obfuscateBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                statusMessage.className = 'message error';
                statusMessage.textContent = 'Nenhum arquivo selecionado.';
                return;
            }

            const luaVersion = document.getElementById('luaVersion').value;
            const preset = document.getElementById('preset').value;
            const seed = document.getElementById('seed').value;

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('luaVersion', luaVersion);
            formData.append('preset', preset);
            if (seed) formData.append('seed', seed);

            obfuscateBtn.disabled = true;
            obfuscateBtn.textContent = 'Processando...';
            statusMessage.textContent = '';
            outputArea.style.display = 'none';
            outputCode.value = '';

            try {
                const response = await fetch('/api/obfuscate', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || 'Erro desconhecido durante a ofuscação.');

                outputCode.value = data.obfuscatedCode;
                outputArea.style.display = 'block';
                statusMessage.className = 'message success';
                statusMessage.textContent = 'Ofuscação concluída com sucesso!';
                
                setTimeout(() => {
                    outputArea.scrollIntoView({ behavior: 'smooth' });
                }, 100);

            } catch (err) {
                statusMessage.className = 'message error';
                statusMessage.textContent = err.message;
            } finally {
                obfuscateBtn.disabled = false;
                obfuscateBtn.textContent = 'Ofuscar Código';
            }
        });

        copyBtn.addEventListener('click', () => {
            outputCode.select();
            document.execCommand('copy');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copiado!';
            setTimeout(() => copyBtn.textContent = originalText, 2000);
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([outputCode.value], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            const originalName = selectedFile ? selectedFile.name.replace(/\.[^/.]+$/, "") : "script";
            a.href = url;
            a.download = `${originalName}_obfuscated.lua`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
